name: Android CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper
      run: |
        mkdir temp-wrapper
        cd temp-wrapper
        gradle wrapper --gradle-version 9.3.1
        cd ..
        cp -r temp-wrapper/gradlew .
        cp -r temp-wrapper/gradlew.bat .
        cp -r temp-wrapper/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
        rm -rf temp-wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK as GitHub Artifact
      uses: actions/upload-artifact@v5
      with:
        name: DocScan-Pro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
