# Single CI/CD pipeline (replaces build.yml + the old build-and-release.yml).
#
#  Pull request          -> debug build + unit tests (no secrets, nothing published)
#  Push to main          -> signed release APK + GitHub Release v<version> (used by the in-app updater)
#  Tag v*                -> signed release with the tag's version
#  Manual (dispatch)     -> signed release
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64   base64 of the release .jks   (base64 -w0 release.jks)
#   STORE_PASSWORD    keystore password
#   KEY_ALIAS         key alias
#   KEY_PASSWORD      key password
# A release is NEVER published unsigned or debug-signed: the job fails with a clear message instead.
name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle (wrapper present)
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Gradle (no wrapper script in repo)
        if: hashFiles('gradlew') == ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build debug + unit tests
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; G=./gradlew; else G=gradle; fi
          $G assembleDebug testDebugUnitTest --stacktrace

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle (wrapper present)
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Gradle (no wrapper script in repo)
        if: hashFiles('gradlew') == ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify signing secrets
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing STORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Refusing to publish an unsigned release."
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          CODE=$(( GITHUB_RUN_NUMBER + 1000 ))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Building version $NAME ($CODE)"

      - name: Build signed release APK
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; G=./gradlew; else G=gradle; fi
          $G assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK was produced."
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          OUT="MS-Scanner-v${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MS-Scanner-v${{ env.VERSION_NAME }}
          path: |
            ${{ env.APK_FILE }}
            ${{ env.APK_FILE }}.sha256
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: MS Scanner v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.APK_FILE }}
            ${{ env.APK_FILE }}.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
